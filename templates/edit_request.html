<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

.container-box{
    max-width:700px;
    margin:80px auto;
}

.card{
    border:none;
    border-radius:25px;
    box-shadow:
    0 10px 30px
    rgba(0,0,0,.08);

    padding:30px;
}

.btn-save{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 20px;
}

.btn-save:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<div class="container-box">

<div class="card">

<h2 class="fw-bold mb-4">

<i class="fas fa-pen-to-square"></i>
Edit Relief Request

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Name
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ req.name }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Location
</label>

<input
type="text"
name="location"
class="form-control"
value="{{ req.location }}"
required>

</div>

<div class="mb-4">

<label class="form-label">
Need
</label>

<input
type="text"
name="need"
class="form-control"
value="{{ req.need }}"
required>

</div>

<button
type="submit"
class="btn-save">

Save Changes

</button>

<a href="/dashboard"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</body>
</html>
