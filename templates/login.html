<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - ReliefX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fb;
            font-family:'Segoe UI',sans-serif;
            overflow-x:hidden;
        }

        /* Navbar */
        .navbar{
            background:rgba(15,23,42,.95);
            backdrop-filter:blur(15px);
            padding:16px 30px;
        }

        .navbar-brand{
            font-size:1.5rem;
            font-weight:700;
        }

        .nav-link{
            color:#dbe4ff !important;
            margin-left:15px;
        }

        .nav-link:hover{
            color:#60a5fa !important;
        }

        /* Hero */
        .hero{
            min-height:100vh;
            background:
            linear-gradient(
                rgba(15,23,42,.85),
                rgba(15,23,42,.92)
            ),
            url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1600&q=80');

            background-size:cover;
            background-position:center;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* Login Card */
        .login-card{
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.2);

            border-radius:30px;
            padding:50px;
            width:100%;
            max-width:500px;

            box-shadow:
            0 20px 50px rgba(0,0,0,.25);

            color:white;
        }

        .login-card h2{
            font-weight:800;
            margin-bottom:10px;
        }

        .login-card p{
            color:#dbe4ff;
            margin-bottom:30px;
        }

        .form-label{
            font-weight:600;
        }

        .form-control{
            border-radius:14px;
            padding:14px;
            border:none;
            background:rgba(255,255,255,.15);
            color:white;
        }

        .form-control::placeholder{
            color:#dbe4ff;
        }

        .form-control:focus{
            box-shadow:none;
            border:1px solid #60a5fa;
            background:rgba(255,255,255,.18);
            color:white;
        }

        .btn-login{
            width:100%;
            border:none;
            border-radius:14px;
            padding:14px;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color:white;
            font-weight:700;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-3px);

            box-shadow:
            0 10px 25px
            rgba(59,130,246,.4);
        }

        .error-box{
            background:#ef4444;
            color:white;
            padding:12px;
            border-radius:12px;
            margin-bottom:20px;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fas fa-shield-heart"></i>
            ReliefX
        </a>

        <div>
            <a class="nav-link d-inline" href="/">
                Home
            </a>

            <a class="nav-link d-inline"
               href="/request">
               Request Help
            </a>

            <a class="nav-link d-inline active"
               href="/login_form">
               Dashboard
            </a>
        </div>

    </div>
</nav>

<section class="hero">

    <div class="login-card">

        <h2>
            Dashboard Login
        </h2>

        <p>
            Login to access the
            Disaster Relief Dashboard.
        </p>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST"
              action="/login_form">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>

            <button
                type="submit"
                class="btn-login">

                <i class="fas fa-right-to-bracket"></i>
                Login to Dashboard

            </button>

        </form>

    </div>

</section>

</body>
</html>
