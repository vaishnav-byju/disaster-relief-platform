<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Edit Request
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

/* Navbar */

.navbar{
    background:
    rgba(15,23,42,.95);

    backdrop-filter:
    blur(15px);

    padding:16px 30px;
}

.navbar-brand{
    font-size:1.5rem;
    font-weight:700;
}

.nav-link{
    color:#dbe4ff !important;
    margin-left:15px;
    font-weight:500;
    transition:.3s;
}

.nav-link:hover{
    color:#60a5fa !important;
}

.nav-link.active{
    color:#60a5fa !important;
    font-weight:700;
}

/* Hero */

.hero{
    background:
    linear-gradient(
    rgba(15,23,42,.88),
    rgba(15,23,42,.9)
    );

    color:white;
    padding:90px 20px 60px;
    text-align:center;
}

.hero h1{
    font-size:3rem;
    font-weight:800;
}

.hero p{
    color:#cbd5e1;
    font-size:1.1rem;
}

/* Form */

.edit-section{
    margin-top:-40px;
}

.edit-card{
    background:white;
    border-radius:30px;
    overflow:hidden;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.08);

    padding:50px;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select{
    border-radius:14px;
    padding:14px;
    border:1px solid #dbe4ff;
}

.form-control:focus,
.form-select:focus{
    box-shadow:none;
    border-color:#2563eb;
}

.btn-save{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #3b82f6
    );

    color:white;
    font-weight:700;
    transition:.3s;
}

.btn-save:hover{
    transform:
    translateY(-3px);

    box-shadow:
    0 10px 25px
    rgba(37,99,235,.3);
}

.btn-back{
    width:100%;
    margin-top:12px;
    border-radius:14px;
}

/* Footer */

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:80px;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

<div class="container">

<a class="navbar-brand"
href="/">

<i class="fas fa-shield-heart"></i>
ReliefX

</a>

<div>

<a class="nav-link d-inline"
href="/">
Home
</a>

<a class="nav-link d-inline"
href="/request">
Request Help
</a>

<a class="nav-link d-inline active"
href="/dashboard">
Dashboard
</a>

{% if session.get("is_admin") %}

<a href="/logout"
class="btn btn-danger rounded-pill ms-3">

<i class="fas fa-right-from-bracket"></i>
Logout

</a>

{% endif %}

</div>
</div>
</nav>


<!-- HERO -->

<section class="hero">

<div class="container">

<h1>
Edit Relief Request
</h1>

<p>
Update request details and
save changes instantly.
</p>

</div>

</section>


<!-- FORM -->

<section class="container edit-section">

<div class="edit-card">

<h3 class="fw-bold mb-4 text-center">
Update Request Details
</h3>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ req.name if req else '' }}"
required>

</div>


<div class="mb-3">

<label class="form-label">
Location
</label>

<input
type="text"
name="location"
class="form-control"
value="{{ req.name if req else '' }}"
required>

</div>


<div class="mb-4">

<label class="form-label">
Type of Need
</label>

<input
type="text"
name="need"
class="form-control"
value="{{ req.name if req else '' }}"
required>

</div>


<button
type="submit"
class="btn-save">

<i class="fas fa-floppy-disk"></i>
Save Changes

</button>

<a href="/dashboard"
class="btn btn-secondary btn-back">

Back to Dashboard

</a>

</form>

</div>

</section>


<footer>

© 2026 ReliefX |
Disaster Relief Coordination Platform

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
